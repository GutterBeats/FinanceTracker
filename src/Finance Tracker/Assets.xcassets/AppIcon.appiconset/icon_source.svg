<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3DD9B8"/>
      <stop offset="100%" stop-color="#0E8A72"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9FC0"/>
      <stop offset="100%" stop-color="#FF7BAA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Ground shadow -->
  <ellipse cx="512" cy="812" rx="230" ry="26" fill="#0000000C"/>

  <!-- Legs -->
  <rect x="392" y="742" width="62" height="72" rx="26" fill="#FF6C9E"/>
  <rect x="570" y="742" width="62" height="72" rx="26" fill="#FF6C9E"/>

  <!-- Body -->
  <ellipse cx="512" cy="540" rx="300" ry="225" fill="url(#pig)"/>

  <!-- Ears -->
  <path d="M 330 380 Q 300 280 400 300 Q 380 360 330 380 Z" fill="#FF6C9E"/>
  <path d="M 694 380 Q 724 280 624 300 Q 644 360 694 380 Z" fill="#FF6C9E"/>

  <!-- Coin slot -->
  <rect x="462" y="350" width="100" height="26" rx="13" fill="#0E7A63"/>

  <!-- Eyes -->
  <circle cx="410" cy="510" r="34" fill="#20242B"/>
  <circle cx="614" cy="510" r="34" fill="#20242B"/>
  <circle cx="422" cy="498" r="10" fill="#FFFFFF"/>
  <circle cx="626" cy="498" r="10" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M 440 590 Q 512 650 584 590" stroke="#20242B" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Snout -->
  <ellipse cx="512" cy="600" rx="90" ry="60" fill="#FF6C9E"/>
  <ellipse cx="482" cy="600" rx="16" ry="22" fill="#B94A72"/>
  <ellipse cx="542" cy="600" rx="16" ry="22" fill="#B94A72"/>

  <!-- Curly tail -->
  <path d="M 812 560 Q 870 540 860 590 Q 850 630 810 610" stroke="#FF6C9E" stroke-width="26" fill="none" stroke-linecap="round"/>
</svg>
